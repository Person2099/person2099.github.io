<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0DDE6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#30C5FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121212;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)" />

  <!-- Subtle grid lines -->
  <line x1="80" y1="0" x2="80" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="160" x2="1200" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Decorative circle -->
  <circle cx="1050" cy="315" r="280" fill="none" stroke="#30C5FF" stroke-opacity="0.06" stroke-width="1"/>
  <circle cx="1050" cy="315" r="200" fill="none" stroke="#30C5FF" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Name -->
  <text x="80" y="280" font-family="'Poppins', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="600" fill="#ffffff" letter-spacing="-1">Sebastian Keet</text>

  <!-- Accent underline -->
  <rect x="80" y="300" width="420" height="4" rx="2" fill="url(#accent)" />

  <!-- Title -->
  <text x="80" y="370" font-family="'Poppins', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="400" fill="#30C5FF" letter-spacing="0.5">Student · Full Stack Developer</text>

  <!-- Location -->
  <text x="80" y="420" font-family="'Poppins', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="300" fill="#d6d6d6" opacity="0.7">Melbourne, Australia</text>

  <!-- URL -->
  <text x="80" y="560" font-family="'Poppins', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="300" fill="#d6d6d6" opacity="0.5">person2099.github.io</text>
</svg>
