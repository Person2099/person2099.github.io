<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FCBEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#57C596;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161B21;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1216;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)" />

  <!-- Subtle grid lines -->
  <line x1="80" y1="0" x2="80" y2="630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="160" x2="1200" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Decorative circle -->
  <circle cx="1050" cy="315" r="280" fill="none" stroke="#3FCBEA" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="1050" cy="315" r="200" fill="none" stroke="#3FCBEA" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Window chrome dots -->
  <circle cx="92" cy="128" r="6" fill="#E8735C" opacity="0.7"/>
  <circle cx="114" cy="128" r="6" fill="#E7AE4E" opacity="0.7"/>
  <circle cx="136" cy="128" r="6" fill="#57C596" opacity="0.7"/>

  <!-- Prompt line -->
  <text x="80" y="188" font-family="'IBM Plex Mono', 'SFMono-Regular', monospace" font-size="24" fill="#57C596">sebastian@melbourne<tspan fill="#7C8894">:~$</tspan> <tspan fill="#EAEEF2">whoami</tspan></text>

  <!-- Name -->
  <text x="80" y="280" font-family="'IBM Plex Mono', 'SFMono-Regular', monospace" font-size="68" font-weight="600" fill="#EAEEF2" letter-spacing="-1">Sebastian Keet</text>

  <!-- Accent underline -->
  <rect x="80" y="300" width="420" height="4" rx="2" fill="url(#accent)" />

  <!-- Title -->
  <text x="80" y="370" font-family="'IBM Plex Mono', 'SFMono-Regular', monospace" font-size="28" font-weight="500" fill="#3FCBEA" letter-spacing="0.5">Student -- Full Stack Developer</text>

  <!-- Location -->
  <text x="80" y="420" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#B7C0C9" opacity="0.85">Melbourne, Australia</text>

  <!-- URL -->
  <text x="80" y="560" font-family="'IBM Plex Mono', 'SFMono-Regular', monospace" font-size="20" font-weight="400" fill="#7C8894">person2099.github.io</text>
</svg>
